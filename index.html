<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <!-- Agar ukuran mengikuti layar HP -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Website Saya</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #eeeeee;

            /* Membuat desain berada di tengah laptop */
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* Ukuran desain Canva */
        .website {
            position: relative;
            width: 393px;
            height: 853px;
        }

        /* Gambar desain Canva */
        .desain {
            width: 393px;
            height: 853px;
            display: block;
        }

        /* Tombol transparan */
        .tombol {
            position: absolute;
            display: block;
            cursor: pointer;

            /* Untuk sementara transparan */
            background: transparent;
            border: navajowhite;
        }

        /* 1. TENTANG SAYA */
        .tentang {
            
        }
            .tentang {
        left: 70px;
         top: 400px;
         width: 230px;
         height: 50px;
         background: transparent;
         opacity: 0.5;
}
        /* 2. PORTOFOLIO */
        .portofolio {
            left: 72px;
            top: 457px;
            width: 249px;
            height: 35px;
        }

        /* 3. WEBSITE */
        .website-btn {
            left: 72px;
            top: 500px;
            width: 249px;
            height: 35px;
        }

        /* 4. TESTIMONI */
        .testimoni {
            left: 72px;
            top: 543px;
            width: 249px;
            height: 35px;
        }

        /* 5. KONTAK SAYA */
        .kontak {
            left: 72px;
            top: 585px;
            width: 249px;
            height: 35px;
        }

        /* Supaya nyaman di HP */
        @media (max-width: 393px) {
            body {
                background: white;
            }

            .website {
                transform: scale(calc(100vw / 393));
                transform-origin: top left;
            }
        }
    </style>
</head>

<body>

    <div class="website">

        <!-- DESAIN CANVA -->
        <img src="./desain..png" class="desain" alt="Desain website">

        <!-- TOMBOL TRANSPARAN -->

        <a
            href="#"
            class="tombol tentang"
            onclick="alert('haii sayang!')">
        </a>

        <a
            href="#"
            class="tombol portofolio"
            onclick="alert('apa kabar!')">
        </a>

        <a
            href="#"
            class="tombol website-btn"
            onclick="alert('')">
        </a>

        <a
            href="#"
            class="tombol testimoni"
            onclick="alert('Testimoni diklik!')">
        </a>

        <a
            href="#"
            class="tombol kontak"
            onclick="alert('Kontak Saya diklik!')">
        </a>

    </div>

</body>
</html>
